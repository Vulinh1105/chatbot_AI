services:
  db:
    image: postgres:15-alpine
    container_name: thinkdocu_postgres
    environment:
      POSTGRES_USER: thinkdocu
      POSTGRES_PASSWORD: thinkdocu_password
      POSTGRES_DB: thinkdocu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: thinkdocu_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thinkdocu_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - API_V1_STR=/api/v1
      - PROJECT_NAME=ThinkDocu
      - SECRET_KEY=thay-bang-mot-chuoi-ngau-nhien-dai-va-bao-mat
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - ADMIN_USERNAME=admin
      - DOCUMENTS_DIR=./backend/documents
      - SQLALCHEMY_DATABASE_URI=postgresql+asyncpg://thinkdocu:thinkdocu_password@db:5432/thinkdocu_db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - db
      - qdrant
    volumes:
      - ./backend/documents:/app/backend/documents
      - ./thinkdocu.db:/app/thinkdocu.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thinkdocu_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_storage:
